name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # A tag pushed with the default GITHUB_TOKEN does not start another
      # workflow, so publish.yml only fires when RELEASE_PLEASE_TOKEN is set.
      - uses: googleapis/release-please-action@v4
        with:
          release-type: dart
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
